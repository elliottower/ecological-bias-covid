requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "causal-learn>=0.1.3",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "requests>=2.28",
    "pyreadr>=0.5",
]
